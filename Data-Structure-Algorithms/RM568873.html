<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Playlist com Lista Encadeada</title>
  <style>
    body{
        font-family: Arial;
        margin: 30px;
    }
    button {
        width: 150px;
    }
    input {
        width: 450px;
    }
    input, button{
        margin: 5px;
        padding: 8px;
    }
    #saida {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #ccc;
    }
  </style>
</head>
<body>

    <h1>Playlist com Lista Encadeada</h1>

    <input type="text" id="nome" placeholder="O que você quer escutar?">
    <br>
    <button onclick="adicionarFim()">Adicionar no Fim</button>
    <button onclick="adicionarInicio()">Adicionar Início</button>
    <button onclick="removerPeloNome()">Remover Música</button>
    <br>
    <button onclick="proximaMusica()">Próxima Música</button>
    <button onclick="contar()">Contar Músicas</button>
    <button onclick="mostrar()">Mostrar Lista</button>
    <br>
    <button onclick="embaralhar()">Embaralhar</button>
    <button onclick="limparPlaylist()">Limpar Playlist</button>

    <div id="saida"></div>
    <div id="status"></div>

    <script>
    
    let valores = [];
    let proximo = [];

    let inicio = -1;
    let ultimo = -1;
    let musicaAtual = -1;

    function adicionarFim() {
        let nome = document.getElementById("nome").value;
        if (nome === "") {
            alert("Adicione o nome da música");
            return;
        }
        let novoIndice = valores.length;
        valores.push(nome);
        proximo.push(-1);

        if (inicio === -1) {
            inicio = novoIndice;
            ultimo = novoIndice;
        } else {
            proximo[ultimo] = novoIndice;
            ultimo = novoIndice;
        }

        document.getElementById("nome").value = "";
        mostrar();
    }

    function adicionarInicio() {
    let nome = document.getElementById("nome").value;
    if (nome === "") { alert("Digite o nome da música."); return; }

    let novoIndice = valores.length;
    valores.push(nome);
    proximo.push(inicio);
    inicio = novoIndice;

    if (ultimo === -1) {
        ultimo = novoIndice;
    }

    document.getElementById("nome").value = "";
    document.getElementById("status").textContent = '"' + nome + '" adicionada no início.';
    mostrar();
}

    function removerPeloNome() {
        let nome = document.getElementById("nome").value;
        if (nome === "") { alert("Digite o nome da música."); return; }
        if (inicio === -1) { alert("Playlist vazia."); return; }

        if (valores[inicio] === nome) {
            if (musicaAtual === inicio) musicaAtual = -1;
            inicio = proximo[inicio];
            if (inicio === -1) ultimo = -1;
            document.getElementById("nome").value = "";
            document.getElementById("status").textContent = '"' + nome + '" removida.';
            mostrar();
            return;
        }

        let anterior = inicio;
        let atual = proximo[inicio];
        let encontrou = false;

        while (atual !== -1) {
            if (valores[atual] === nome) { encontrou = true; break; }
            anterior = atual;
            atual = proximo[atual];
        }

        if (!encontrou) {
            document.getElementById("status").textContent = '"' + nome + '" não encontrada.';
            document.getElementById("nome").value = "";
            return;
        }

        proximo[anterior] = proximo[atual];
        if (ultimo === atual) ultimo = anterior;
        if (musicaAtual === atual) musicaAtual = -1;

        document.getElementById("nome").value = "";
        document.getElementById("status").textContent = '"' + nome + '" removida.';
        mostrar();
    }

    function proximaMusica() {
        if (inicio === -1) { alert("Playlist vazia."); return; }

        if (musicaAtual === -1) {
            musicaAtual = inicio;
        } else {
            let prox = proximo[musicaAtual];
            musicaAtual = (prox === -1) ? inicio : prox;
        }

        document.getElementById("status").textContent = "Tocando: " + valores[musicaAtual];
        mostrar();
    }

    function contar() {
        let contador = 0;
        let atual = inicio;
        while (atual !== -1) {
            contador++;
            atual = proximo[atual];
        }
        document.getElementById("status").textContent = "Total de músicas: " + contador;
    }

    function limparPlaylist() {
        valores = [];
        proximo = [];
        inicio = -1;
        ultimo = -1;
        musicaAtual = -1;
        document.getElementById("status").textContent = "Playlist limpa.";
        mostrar();
    }

    function mostrar() {
        let resultado = "";
        let atual = inicio;

        while (atual !== -1) {
            let nome = valores[atual];
            if (atual === musicaAtual) nome = "♪ " + nome;
            resultado += nome + " → ";
            atual = proximo[atual];
        }
        if (inicio === -1) {
            resultado = "Lista vazia";
        } else {
            resultado += "null";
        }

        document.getElementById("saida").innerHTML = resultado;
    }
    
    function embaralhar() {
        if (inicio === -1) { alert("Playlist vazia."); return; }

        
        let indices = [];
        let atual = inicio;
        while (atual !== -1) {
            indices.push(atual);
            atual = proximo[atual];
        }

        
        let n = indices.length;
        for (let i = n - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            let tmp = indices[i];
            indices[i] = indices[j];
            indices[j] = tmp;
        }

        
        for (let k = 0; k < indices.length - 1; k++) {
            proximo[indices[k]] = indices[k + 1];
        }
        proximo[indices[indices.length - 1]] = -1;

        inicio = indices[0];
        ultimo = indices[indices.length - 1];
        musicaAtual = -1;

        document.getElementById("status").textContent = "Playlist embaralhada!";
        mostrar();
    }

    mostrar();
    </script>

</body>
</html>
