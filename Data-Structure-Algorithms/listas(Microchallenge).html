<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lista Encadeada Simples</title>
  <style>
    body{
        font-family: Arial;
        margin: 30px;
    }
    button {
        width: 150px;
    }
    input {
        width: 450px;
    }
    input, button{
        margin: 5px;
        padding: 8px;
    }
    #saída {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid
    }
  </style>
</head>
<body>

    <h1>Lista Encadeada (versão simples)</h1>

    <input type="text" id="nome" placeholder="Digite um nome">
    <br>
    <button onclick="adicionarFim()">Adicionar no Fim</button>
    <button onclick="adicionarInicio()">Adicionar no Inicio</button>
    <button onclick="removerInicio()">Remover Inicio</button>
    <br>
     <button onclick="contar()">Contar elemento</button>
      <button onclick="buscar()">Buscar nome</button>
    <button onclick="mostrar()">Mostrar Lista</button>

    <div id="saida"></div>

    <script>
    // "lista encadeada" simulada
    let valores = [];
    let proximo = [];

    let inicio = -1;
    let ultimo = -1;

    function adicionarFim() {
        let nome = document.getElementById("nome").value;
        if (nome === "") {
            alert("Digite um nome");
            return;
        }
        let novoIndice = valores.length;
        valores.push(nome);
        proximo.push(-1);

        if (inicio === -1) {
            inicio = novoIndice;
            ultimo = novoIndice;
        } else {
            proximo[ultimo] = novoIndice;
            ultimo = novoIndice;
        }

        document.getElementById("nome").value = "";
        mostrar();
    }

     function adicionarInicio() {
        let nome = document.getElementById("nome").value;
        if (nome === "") {
            alert("Digite um nome");
            return;
        }
        let novoIndice = valores.length;
        valores.push(nome); 
        // Mudar aqui
        // Novo aponta para o antigo início
        proximo.push(inicio);
        // Novo vira início
        inicio = novoIndice;
        // Se a lista estiver vazia
        if (ultimo === -1) {
            ultimo = novoIndice;
        }
        // Até aqui

        document.getElementById("nome").value = "";
        mostrar();
    }

    function removerInicio() {
        if(inicio === -1){
            alert("Lista vazia");
            return;
        }
        // Inicio passa a ser o próximo
        inicio = proximo[inicio];

        //se ficou vazia
        if (inicio === -1){
            ultimo = -1;
        }
        mostrar();
    }
    
    function mostrar() {
        let resultado = "";
        let atual = inicio;

        while (atual !== -1) {
            resultado += valores[atual] + " → ";
            atual = proximo[atual];
        }
        if (inicio === -1) {
            resultado = "Lista vazia";
        } else{
             resultado += "null";
        }

        document.getElementById("saida").innerHTML = resultado;
    }
    </script>

</body>
</html>
